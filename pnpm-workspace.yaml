packages:
  - "."

overrides:
  # MDXEditor 3.55.0 pins 4.1.1; avoid a major editor migration for YAML DoS fixes.
  "@mdxeditor/editor@3>js-yaml": 4.3.2
  # Tailwind 3/postcss-nested require v6; typography pins 6.0.10. The CPU DoS
  # fix is only in v7.1.6. Validate generated CSS when changing this major override.
  "postcss-selector-parser@>=6 <7": 7.1.6

resolutionMode: highest
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: true
minimumReleaseAgeExclude:
  - react
  - react-dom
  - next
  - "@next/*"
  - eslint-config-next
allowBuilds:
  es5-ext: true
  sharp: true
  unrs-resolver: true
