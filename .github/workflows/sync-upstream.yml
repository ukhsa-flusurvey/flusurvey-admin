# Brings changes from case-framework/case-admin into this repo.
#
# Run it by hand after a change lands in case-admin: Actions › Sync from case-admin › Run workflow,
# or `gh workflow run sync-upstream.yml --repo <this repo>`. It sets the `upstream` branch to
# case-admin's `main` and opens a pull request from `upstream` into `main` when `main` doesn't have
# those changes yet. An open pull request just picks up the newer commits.
#
# Merge it with "Create a merge commit", not squash or rebase: a merge commit records which
# upstream commits are in, so the next sync only brings what is new. If GitHub reports conflicts,
# resolve them locally: `git fetch origin && git checkout main && git merge origin/upstream`.
#
# If case-admin ever changes files under .github/workflows/, the push needs a token with the
# workflow scope instead of the built-in one.
#
# Changes for every platform belong in case-admin; this repo only adds files of its own, so these
# merges stay conflict-free.

name: Sync from case-admin

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream

env:
  UPSTREAM_REPO: case-framework/case-admin
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror case-admin main to the upstream branch
        id: mirror
        run: |
          git fetch --no-tags "https://github.com/$UPSTREAM_REPO.git" "$UPSTREAM_BRANCH"
          upstream=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$upstream" origin/main; then
            echo "main already has $UPSTREAM_REPO@${upstream::7}."
            echo "behind=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push --force origin "$upstream:refs/heads/$SYNC_BRANCH"
          echo "behind=$(git rev-list --count "origin/main..$upstream")" >> "$GITHUB_OUTPUT"
          echo "sha=${upstream::7}" >> "$GITHUB_OUTPUT"
          {
            echo "log<<EOF"
            git log --no-merges --format='- %s (%h)' "origin/main..$upstream" | head -50
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.mirror.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BEHIND: ${{ steps.mirror.outputs.behind }}
          SHA: ${{ steps.mirror.outputs.sha }}
          LOG: ${{ steps.mirror.outputs.log }}
        run: |
          body=$(printf '%s\n' \
            "Brings $BEHIND new commit(s) from $UPSTREAM_REPO \`main\` (up to $SHA)." \
            "" \
            "$LOG" \
            "" \
            "Merge with **Create a merge commit** (not squash or rebase), so the next sync only brings what is new." \
            "If GitHub reports conflicts: \`git fetch origin && git checkout main && git merge origin/$SYNC_BRANCH\`, resolve, push." \
            "" \
            "Opened by the *Sync from case-admin* workflow.")
          number=$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body "$body"
            echo "Updated pull request #$number."
          else
            gh pr create --head "$SYNC_BRANCH" --base main --title "Sync from $UPSTREAM_REPO" --body "$body"
          fi
